name: OCI Mumbai Sniper v3.1

on:
  schedule:
    # A new run is queued every 5 minutes. The concurrency group below keeps one
    # run active plus one waiting, so there is almost no gap between 5h45m runs.
    # Lots of "cancelled" runs in the Actions tab are expected (replaced waiters).
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: oci-mumbai-sniper
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # only used to disable this workflow once the VM exists

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      OCI_BIN: /home/runner/bin/oci
      OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"
      GH_TOKEN: ${{ github.token }}

      # ---- identifiers and keys: stored as repository secrets ----
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
      SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
      BOOT_VOLUME_ID: ${{ secrets.OCI_BOOT_VOLUME_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }} # optional, phone alerts via ntfy.sh

      # ---- settings you may want to tweak ----
      OCI_REGION: "ap-mumbai-1"
      AVAILABILITY_DOMAIN: "Jtuw:AP-MUMBAI-1-AD-1"
      SHAPE: "VM.Standard.A1.Flex"
      # Small requests find capacity far more often. Resize up in the console later.
      OCPUS: "1"
      MEMORY_GB: "6"
      INSTANCE_NAME: "saitoVM"
      NORMAL_WAIT: "100" # seconds between attempts (+0-19s jitter). ~60-80s gets 429s.

    steps:

      # ------------------------------------------------------------
      # 0. Fail fast if a secret is missing or misnamed
      # ------------------------------------------------------------
      - name: Preflight
        shell: bash
        run: |
          missing=0
          for v in OCI_TENANCY_OCID OCI_USER_OCID OCI_FINGERPRINT OCI_KEY_CONTENT SUBNET_ID BOOT_VOLUME_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repository secret for $v"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All required secrets are present."

      # ------------------------------------------------------------
      # Manual runs only: prove the phone alert works
      # ------------------------------------------------------------
      - name: Test notification (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC is not set; skipping."
            exit 0
          fi
          curl -fsS -m 15 -H "Title: OCI sniper test" \
            -d "Test ping from GitHub Actions. If you see this, success alerts will work." \
            "https://ntfy.sh/$NTFY_TOPIC" > /dev/null && echo "Test notification sent."

      # ------------------------------------------------------------
      # 1. Install OCI CLI
      # ------------------------------------------------------------
      - name: Install OCI CLI
        shell: bash
        run: |
          set -e

          bash -c "$(curl -L https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh)" \
            -- --accept-all-defaults

          echo "/home/runner/bin" >> "$GITHUB_PATH"

      # ------------------------------------------------------------
      # 2. Configure OCI credentials
      # ------------------------------------------------------------
      - name: Setup Credentials
        shell: bash
        run: |
          set -e
          umask 077

          mkdir -p "$HOME/.oci"

          printf '%s\n' "$OCI_KEY_CONTENT" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

          {
            echo "[DEFAULT]"
            echo "user=$OCI_USER_OCID"
            echo "fingerprint=$OCI_FINGERPRINT"
            echo "tenancy=$OCI_TENANCY_OCID"
            echo "region=$OCI_REGION"
            echo "key_file=$HOME/.oci/oci_api_key.pem"
          } > "$HOME/.oci/config"

          chmod 600 "$HOME/.oci/config"
          echo "OCI credentials configured."

      # ------------------------------------------------------------
      # 3. Do we already have the VM? If so, skip the sniper entirely
      # ------------------------------------------------------------
      - name: Check Existing Instance
        id: check
        shell: bash
        run: |
          set +e

          echo "Checking whether $INSTANCE_NAME already exists..."

          EXISTING_RESPONSE=$(
            timeout 60s "$OCI_BIN" compute instance list \
              --no-retry \
              --compartment-id "$OCI_TENANCY_OCID" \
              --availability-domain "$AVAILABILITY_DOMAIN" \
              --display-name "$INSTANCE_NAME" \
              --all \
              --output json \
              2>&1
          )

          RC=$?

          if [ "$RC" -eq 0 ]; then

            EXISTING_ID=$(
              printf '%s' "$EXISTING_RESPONSE" |
              jq -r '
                .data[]?
                | select(."lifecycle-state" | IN("TERMINATED", "TERMINATING") | not)
                | .id
              ' |
              head -n 1
            )

            if [[ "$EXISTING_ID" == ocid1.instance.* ]]; then
              echo ""
              echo "=================================================="
              echo "INSTANCE ALREADY EXISTS: $EXISTING_ID"
              echo "Skipping the sniper and disabling this workflow."
              echo "=================================================="

              echo "exists=true" >> "$GITHUB_OUTPUT"

              gh workflow disable "$GITHUB_WORKFLOW" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
                || echo "Could not auto-disable the workflow. Disable it manually in the Actions tab."

              exit 0
            fi

            echo "No existing non-terminated $INSTANCE_NAME instance found."

          else

            echo "Could not complete existing-instance check:"
            echo "$EXISTING_RESPONSE"
            echo "Continuing to launch logic; the launch request itself is authoritative."

          fi

          echo "exists=false" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 4. Keep trying for almost the full GitHub job lifetime
      # ------------------------------------------------------------
      - name: Sniper
        if: steps.check.outputs.exists != 'true'
        shell: bash
        run: |
          set +e

          # 335 minutes leaves room for install steps and one last slow attempt
          # before the 350-minute job timeout.
          MAX_RUNTIME_SECONDS=$((335 * 60))
          START_TIME=$(date +%s)
          RATE_LIMIT_WAIT=180
          ATTEMPT=0
          N_CAP=0
          N_429=0

          # Pull just the "message" field out of an OCI ServiceError JSON blob.
          oci_msg() {
            printf '%s' "$1" | grep -oE '"message": ?"[^"]*"' | head -1
          }

          notify() {
            [ -z "$NTFY_TOPIC" ] && return 0
            curl -fsS -m 15 \
              -H "Title: $1" \
              -H "Priority: urgent" \
              -d "$2" \
              "https://ntfy.sh/$NTFY_TOPIC" > /dev/null 2>&1 || true
          }

          disable_self() {
            if gh workflow disable "$GITHUB_WORKFLOW" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "This workflow has been disabled."
            else
              echo "Could not auto-disable the workflow. Disable it manually in the Actions tab."
            fi
          }

          echo ""
          echo "=================================================="
          echo "OCI MUMBAI A1 SNIPER STARTED"
          echo "=================================================="
          echo "Shape:       $SHAPE"
          echo "OCPUs:       $OCPUS"
          echo "Memory:      ${MEMORY_GB} GB"
          echo "AD:          $AVAILABILITY_DOMAIN"
          echo "Runtime:     ~5h35m"
          echo "Normal wait: ${NORMAL_WAIT}s (+ jitter)"
          echo "=================================================="
          echo ""

          while true; do

            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))

            if [ "$ELAPSED" -ge "$MAX_RUNTIME_SECONDS" ]; then
              echo ""
              echo "=================================================="
              echo "SNIPER TIME WINDOW FINISHED after $ATTEMPT attempts."
              echo "Capacity responses: $N_CAP | 429 rate limits: $N_429"
              echo "No instance was provisioned during this run."
              echo "The next scheduled run will continue."
              echo "=================================================="
              exit 0
            fi

            ATTEMPT=$((ATTEMPT + 1))

            echo ""
            echo "--------------------------------------------------"
            echo "Attempt #$ATTEMPT"
            echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "Elapsed: $((ELAPSED / 60)) minutes"
            echo "--------------------------------------------------"

            RESPONSE=$(
              timeout 90s "$OCI_BIN" compute instance launch \
                --no-retry \
                --connection-timeout 15 \
                --read-timeout 60 \
                --compartment-id "$OCI_TENANCY_OCID" \
                --availability-domain "$AVAILABILITY_DOMAIN" \
                --shape "$SHAPE" \
                --shape-config "{\"ocpus\": $OCPUS, \"memoryInGBs\": $MEMORY_GB}" \
                --subnet-id "$SUBNET_ID" \
                --source-details "{\"sourceType\": \"bootVolume\", \"bootVolumeId\": \"$BOOT_VOLUME_ID\"}" \
                --display-name "$INSTANCE_NAME" \
                --assign-public-ip true \
                --query 'data.id' \
                --raw-output \
                2>&1
            )

            RC=$?

            # ------------------------------------------------------
            # SUCCESS
            # ------------------------------------------------------
            # Look for the instance OCID anywhere in the output so a stray
            # warning line on stderr cannot hide a real success.
            INSTANCE_ID=$(printf '%s' "$RESPONSE" | grep -oE 'ocid1\.instance\.[A-Za-z0-9._-]+' | head -1)

            if [ "$RC" -eq 0 ] && [ -n "$INSTANCE_ID" ]; then

              echo ""
              echo "=================================================="
              echo "          SUCCESS: INSTANCE CREATED"
              echo "=================================================="
              echo "Instance ID: $INSTANCE_ID"
              echo "=================================================="
              echo ""

              notify "OCI A1 SUCCESS" "Instance $INSTANCE_NAME created after $ATTEMPT attempts in this run."
              disable_self
              exit 0
            fi

            # ------------------------------------------------------
            # TIMEOUT / NETWORK HANG
            # ------------------------------------------------------
            if [ "$RC" -eq 124 ]; then
              echo "OCI request timed out. Waiting 180 seconds before retrying..."
              sleep 180
              continue
            fi

            # ------------------------------------------------------
            # 429 RATE LIMIT
            # ------------------------------------------------------
            if echo "$RESPONSE" | grep -Eqi \
              'TooManyRequests|too many requests|status.?[:=] ?429|HTTP.?429'; then

              N_429=$((N_429 + 1))
              echo ">>> OCI RATE LIMIT (429) <<< $(oci_msg "$RESPONSE")"
              echo "Backing off for ${RATE_LIMIT_WAIT} seconds..."

              sleep "$RATE_LIMIT_WAIT"

              # 180 -> 360 -> 720 -> 900 -> 900...
              RATE_LIMIT_WAIT=$((RATE_LIMIT_WAIT * 2))
              if [ "$RATE_LIMIT_WAIT" -gt 900 ]; then
                RATE_LIMIT_WAIT=900
              fi

              continue
            fi

            # ------------------------------------------------------
            # REAL OCI CAPACITY FAILURE (the normal case)
            # ------------------------------------------------------
            if echo "$RESPONSE" | grep -Eqi \
              'Out of host capacity|out of capacity|capacity.*unavailable|insufficient.*capacity'; then

              N_CAP=$((N_CAP + 1))
              echo ">>> OCI A1 CAPACITY UNAVAILABLE <<<"
              echo "Oracle said: $(oci_msg "$RESPONSE")"

              RATE_LIMIT_WAIT=180

              WAIT=$((NORMAL_WAIT + RANDOM % 20))
              echo "Waiting ${WAIT} seconds..."
              sleep "$WAIT"
              continue
            fi

            # ------------------------------------------------------
            # TRANSIENT OCI / NETWORK ERROR
            # (status codes are anchored so digits inside request IDs
            #  or OCIDs cannot trigger a false match)
            # ------------------------------------------------------
            if echo "$RESPONSE" | grep -Eqi \
              'InternalServerError|InternalError|Internal Server Error|ServiceUnavailable|Service Unavailable|GatewayTimeout|Gateway Timeout|RequestTimeout|ConnectionError|connection.*reset|"status": ?50[234]'; then

              echo ""
              echo ">>> TRANSIENT OCI/SERVER ERROR <<<"
              echo "$RESPONSE"
              echo "Waiting 180 seconds before retrying..."

              sleep 180
              continue
            fi

            # ------------------------------------------------------
            # FATAL CONFIGURATION / PERMISSION ERRORS
            # Stop, alert once, and disable the workflow so you do not get
            # a failure email every 5 minutes. Fix the cause, then re-enable.
            # ------------------------------------------------------
            if echo "$RESPONSE" | grep -Eqi \
              'NotAuthenticated|NotAuthorized|NotAuthorizedOrNotFound|InvalidParameter|LimitExceeded|QuotaExceeded|IncorrectState'; then

              echo ""
              echo "=================================================="
              echo "FATAL OCI ERROR"
              echo "=================================================="
              echo "$RESPONSE"
              echo ""
              echo "This is not a normal capacity failure."
              echo "Fix the configuration, then re-enable the workflow."
              echo "=================================================="

              notify "OCI sniper STOPPED (fatal error)" "Check the Actions log. Workflow disabled until you fix it."
              disable_self
              exit 1
            fi

            # ------------------------------------------------------
            # UNKNOWN ERROR: show it, treat as transient
            # ------------------------------------------------------
            echo ""
            echo ">>> UNRECOGNIZED OCI RESPONSE <<<"
            echo "$RESPONSE"
            echo "Treating it as transient and waiting 180 seconds..."

            sleep 180

          done
